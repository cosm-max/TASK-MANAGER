<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        /* Base Dark Theme Styles */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-color: #00e5ff; /* Cyan accent */
            --border-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 2rem;
        }

        /* Form Styles */
        .task-form {
            background-color: var(--surface-color);
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        input, textarea {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px;
            border-radius: 4px;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        /* Task Cards Container */
        .tasks-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
            max-width: 600px;
        }

        /* Responsive grid for larger phones and tablets */
        @media (min-width: 600px) {
            .tasks-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Individual Card */
        .task-card {
            background-color: var(--surface-color);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .task-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
        }

        .task-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin: 0 0 15px 0;
            flex-grow: 1; /* Pushes the button to the bottom */
        }

        .read-more-btn {
            background-color: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            width: auto;
            align-self: flex-start;
        }

        .read-more-btn:hover {
            background-color: var(--accent-color);
            color: #000;
        }

        /* Modal / Popup Styles */
        .modal-overlay {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background-color: var(--surface-color);
            padding: 25px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            width: auto;
            padding: 0;
        }

        .modal-close:hover {
            color: var(--text-primary);
            background: none;
            opacity: 1;
        }
        
        .modal-description {
            white-space: pre-wrap; /* Preserves newlines in the description */
            color: var(--text-secondary);
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>Task Manager</h1>

    <!-- Form to add new task -->
    <form class="task-form" id="taskForm">
        <div class="input-group">
            <label for="title">Task Title</label>
            <input type="text" id="title" required>
        </div>
        <div class="input-group">
            <label for="description">Task Description</label>
            <textarea id="description" rows="4" required></textarea>
        </div>
        <button type="submit">Add Task</button>
    </form>

    <!-- Where tasks will be rendered -->
    <div class="tasks-container" id="tasksList"></div>

    <!-- Popup for full task details -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2 id="modalTitle"></h2>
            <p class="modal-description" id="modalDescription"></p>
        </div>
    </div>

    <script>
        // Fetch and display all tasks on page load
        async function loadTasks() {
            try {
                const response = await fetch('/tasks');
                const tasks = await response.json();
                const tasksList = document.getElementById('tasksList');
                tasksList.innerHTML = ''; // Clear current list

                tasks.forEach(task => {
                    const card = document.createElement('div');
                    card.className = 'task-card';
                    card.innerHTML = `
                        <h3>${task.title}</h3>
                        <p>${task.preview}</p>
                        <button class="read-more-btn" onclick="readTask('${task.id}')">Read More</button>
                    `;
                    tasksList.appendChild(card);
                });
            } catch (error) {
                console.error('Failed to load tasks:', error);
            }
        }

        // Add a new task
        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;

            try {
                const response = await fetch('/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description })
                });

                if (response.ok) {
                    // Reset form and reload tasks
                    e.target.reset();
                    loadTasks();
                } else {
                    alert('Failed to save task. Ensure title and description are filled.');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });

        // Fetch single task details and show modal
        async function readTask(id) {
            try {
                const response = await fetch(`/tasks/${id}`);
                const task = await response.json();
                
                document.getElementById('modalTitle').innerText = task.title;
                document.getElementById('modalDescription').innerText = task.description;
                document.getElementById('taskModal').style.display = 'flex';
            } catch (error) {
                console.error('Failed to load task details:', error);
            }
        }

        // Close the modal
        function closeModal() {
            document.getElementById('taskModal').style.display = 'none';
        }

        // Close modal if clicked outside the content box
        document.getElementById('taskModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('taskModal')) {
                closeModal();
            }
        });

        // Initial load
        loadTasks();
    </script>
</body>
</html>
